<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #f0f2f5;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    #questionCount {
      margin-bottom: 15px;
      font-weight: bold;
    }
    .option {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 2px solid #007BFF;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      transition: 0.3s;
    }
    .option:hover {
      background: #e6f0ff;
    }
    .option.selected {
      background: #007BFF;
      color: white;
    }
    .dark-mode {
      background: #1e1e1e;
      color: white;
    }
    .dark-mode .container {
      background: #2c2c2c;
    }
    #darkToggle {
      margin-top: 15px;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #444;
      color: white;
    }
    /* Progress Bar */
    .progress-bar {
      width: 100%;
      background: #ddd;
      border-radius: 5px;
      overflow: hidden;
      margin: 15px 0;
    }
    #progress {
      height: 10px;
      width: 0;
      background: #28a745;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz Time!</h1>

    <!-- Timer -->
    <div id="timer">Time Left: <span id="time">60</span> sec</div>

    <!-- Question Counter -->
    <div id="questionCount">Question 1 of X</div>

    <!-- Progress Bar -->
    <div class="progress-bar">
      <div id="progress"></div>
    </div>

    <!-- Question Area (script.js will inject here) -->
    <div id="quiz"></div>

    <!-- Next Button -->
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <!-- Dark Mode Toggle -->
    <button id="darkToggle" onclick="toggleDark()">🌙 Toggle Dark Mode</button>
  </div>

  <script src="script.js"></script>
  <script>
    function toggleDark() {
      document.body.classList.toggle("dark-mode");
    }
  </script>
</body>
</html>
